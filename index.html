<body>
<style>
  :root {
    color-scheme: dark;
    --bg: #17120f;
    --panel: #231b16;
    --panel-2: #2d231c;
    --line: #4a3a2c;
    --ink: #f1e4cf;
    --ink-dim: #b9a68b;
    --brass: #d19a3f;
    --copper: #c0693b;
    --good: #8fcf72;
    --bad: #e2674f;
    --steam: #e9f0f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 'Alegreya Sans', system-ui, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 8px 10px;
    height: 100%; display: flex; flex-direction: column; gap: 8px; overflow: hidden;
  }
  html { height: 100%; }
  h1, h2 { font-family: 'Cinzel', Georgia, serif; margin: 0; letter-spacing: 0.04em; }
  h1 { font-size: 20px; color: #e2b564; background: linear-gradient(#fff6d0 0%, #f6d684 30%, #c58a2c 48%, #5c3a10 52%, #d9a850 56%, #f6d684 78%, #9a6a24 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: .08em; filter: drop-shadow(1px 0 0 #24140a) drop-shadow(-1px 0 0 #24140a) drop-shadow(0 -1px 0 #24140a) drop-shadow(0 1px 0 #24140a) drop-shadow(0 3px 0 #4a2c0c) drop-shadow(0 5px 6px #000); }
  .ico { width: 22px; height: 22px; flex: none; align-self: center; filter: drop-shadow(0 1px 2px #000a); }
  h2 { font-size: 12px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 6px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; }
  .stat { display: flex; gap: 6px; align-items: baseline; }
  .stat b { font-size: 18px; color: var(--steam); font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-dim); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
  .spacer { flex: 1 1 0; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(230px, 27vw, 330px); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "stage enemy" "parts parts"; gap: 8px; }
  @media (max-aspect-ratio: 1/1) {
    body { overflow: auto; height: auto; min-height: 100%; }
    main { display: flex; flex-direction: column; }
    .stage { height: 56vh; min-height: 300px; flex: none; }
  }
  .stage { grid-area: stage; min-height: 0; border: 2px solid #5b4330; border-radius: 6px; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255,225,170,.14), 0 2px 8px #000a; }
  canvas#board { position: absolute; left: 13px; top: 13px; display: block; width: calc(100% - 26px); height: calc(100% - 26px); border-radius: 3px; touch-action: none; cursor: crosshair; box-shadow: 0 0 0 2px #120c08, 0 0 0 3px #8a6a3a66, inset 0 0 30px #000; }
  .tools { position: absolute; right: 22px; bottom: 22px; z-index: 4; display: flex; gap: 6px; }
  .tools button { padding: 4px 10px; font-size: 14px; background: #000a; }
  .seg { display: inline-flex; border: 1px solid #6a4f36; border-radius: 8px; overflow: hidden; background: #000a; }
  .seg button { border: 0; border-radius: 0; background: none; padding: 5px 12px; font-size: 14px; color: var(--ink-dim); }
  .seg button.on { background: linear-gradient(#e0ad52, #b87a28); color: #20150a; font-weight: 700; }
  .tools button.on { border-color: var(--brass); color: var(--brass); }
  .hint { position: absolute; left: 24px; bottom: 20px; right: 280px; z-index: 4; font-size: 12px; color: var(--ink-dim); pointer-events: none; text-shadow: 0 1px 2px #000; }
  .toast { position: absolute; z-index: 5; left: 50%; top: 24px; transform: translateX(-50%); background: #000c; border: 1px solid var(--line); padding: 6px 14px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; }
  .banner { position: absolute; inset: 13px; z-index: 5; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: #000a; text-align: center; padding: 16px; }
  .banner.on { display: flex; }
  .banner h3 { font-family: 'Cinzel', Georgia, serif; font-size: 40px; margin: 0; }
  .banner.win h3 { color: var(--good); }
  .banner.lose h3 { color: var(--bad); }
  .arenabar { position: absolute; right: 24px; top: 22px; z-index: 4; display: none; gap: 6px; }
  .arenabar.on { display: flex; }
  aside { grid-area: enemy; min-height: 0; display: flex; }
  aside .card { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .ev { position: relative; flex: 1; min-height: 50px; }
  .partsbox { grid-area: parts; }

  .card, header, .stage { position: relative; background: linear-gradient(rgba(18,12,8,.3), rgba(18,12,8,.5)), var(--plate) 0 0 / 256px 256px, #241a13; }
  .card::before, header::before, .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: inherit;
    background:
      var(--b1, var(--rivdot)) 3px 3px / 15px 15px no-repeat, var(--b2, var(--rivdot)) calc(100% - 3px) 3px / 15px 15px no-repeat,
      var(--b3, var(--rivdot)) 3px calc(100% - 3px) / 15px 15px no-repeat, var(--b4, var(--rivdot)) calc(100% - 3px) calc(100% - 3px) / 15px 15px no-repeat;
  }
  header, .card { isolation: isolate; }
  header::before, .card::before { z-index: -1; }
  .card { border: 2px solid #5b4330; border-radius: 6px; padding: 14px 18px;
    box-shadow: inset 0 1px 0 rgba(255,225,170,.14), inset 0 -3px 8px rgba(0,0,0,.5), 0 2px 8px #000a; }
  header { border: 2px solid #5b4330; border-radius: 6px; padding: 8px 20px;
    box-shadow: inset 0 1px 0 rgba(255,225,170,.14), inset 0 -3px 8px rgba(0,0,0,.5), 0 2px 8px #000a; }
  button {
    font: inherit; color: var(--ink); background: linear-gradient(#3a2d22, #2a2018); border: 1px solid #6a4f36;
    box-shadow: inset 0 1px 0 rgba(255,225,170,.15), 0 1px 2px #0008;
    border-radius: 5px; padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--brass); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: linear-gradient(#e0ad52, #b87a28); color: #20150a; font-weight: 700; border-color: #f0c577; font-size: 18px; padding: 10px 14px; width: 100%; letter-spacing: .04em; }
  button.primary:disabled { filter: grayscale(.6); }
  .parts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(64px, 1fr); gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
  .statbox { position: absolute; left: 24px; top: 24px; z-index: 4; font-size: 13px; line-height: 1.45; color: var(--ink-dim); background: #0009; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; pointer-events: none; }
  .statbox b { color: var(--steam); }
  .tile { display: flex; flex-direction: column; background: linear-gradient(rgba(30,22,16,.35), rgba(18,12,8,.55)), var(--plate) 40px 70px / 256px 256px, #261c15; border: 1px solid #6a4f36; border-radius: 5px; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255,225,170,.12), 0 1px 3px #000a; }
  .tile .cost, .tile .up, .chip, .stat b, .tile .uprow { font-variant-numeric: lining-nums tabular-nums; font-feature-settings: 'lnum' 1; }
  .tile .cost::after, .tile .up::after, .chip.priced::after { content: ''; display: inline-block; width: .5em; height: .72em; margin-left: .3em; vertical-align: baseline; background-color: currentColor; -webkit-mask: var(--gly) center / contain no-repeat; mask: var(--gly) center / contain no-repeat; }

<script>
(function () {
  'use strict';
  // ------------------------------------------------------------ data
  const CELL = 64;
  const TYPES = {
    core:   { name: 'Steam Core', hp: 60, cost: 0,  desc: 'If it breaks, you lose. Each level: +20% core health and +5% damage to all cannons.' },
    cannon: { name: 'Cannon',   hp: 14, dmg: 10, per: 2, cost: 30, desc: 'Every 2 s it hits an enemy part (10 damage).' },
    spring: { name: 'Spring',     hp: 10, cost: 25, desc: 'Adjacent weapons fire 20% faster.' },
    boiler: { name: 'Boiler',   hp: 10, cost: 40, desc: 'Adjacent weapons deal +30% damage. If it explodes, it hurts its neighbours.' },
    gear:   { name: 'Gear', hp: 12, cost: 35, desc: 'Adjacent parts have +25% health.' },
    plate:  { name: 'Plate',   hp: 30, cost: 15, desc: 'Lots of health, cheap. Put it on the outside: shots prefer exposed parts, so it works as a decoy and protects cannons and core.' },
    shield: { name: 'Shield',     hp: 12, cost: 30, desc: 'Adjacent parts take 30% less damage.' },
    mortar: { name: 'Mortar', hp: 12, dmg: 16, per: 4.5, cost: 55, desc: 'Slow lobbed shell: 16 damage to a part and half of it to the parts next to it.' },
    tesla:  { name: 'Tesla', hp: 12, dmg: 4, per: 1.3, cost: 50, desc: 'Fast lightning that ignores decoys: it hits any enemy part with the same chance.' },
    repair: { name: 'Repairer', hp: 10, heal: 2, cost: 45, desc: 'Every second it heals each adjacent part by 2 health.' },
    wheel:  { name: 'Wheels', hp: 14, cost: 40, desc: 'Adjacent parts dodge 12% of the shots aimed at them.' }
  };
  const BUILDABLE = ['cannon', 'spring', 'boiler', 'gear', 'plate', 'shield', 'repair', 'wheel', 'mortar', 'tesla'];
  const isGun = t => t === 'cannon' || t === 'mortar' || t === 'tesla';
  const UPGRADABLE = ['cannon', 'mortar', 'tesla', 'spring', 'boiler', 'gear', 'plate', 'shield', 'repair', 'wheel', 'core'];
  const UNLOCK_LEAGUE = { cannon: 1, plate: 1, spring: 2, shield: 3, boiler: 4, gear: 5, repair: 6, wheel: 7, mortar: 8, tesla: 9, core: 1 };
  const isLocked = t => t !== 'core' && S.league < (UNLOCK_LEAGUE[t] || 1);
  const NAMES = ['Brass', 'Steamlet', 'Rusty', 'Piston', 'Clank', 'Copper', 'Bolt', 'Smokestack', 'Puff', 'Rivet', 'Crank', 'Ember', 'Spark', 'Latch'];
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const SAVE_KEY = 'automa-vapore-v1';

  // ------------------------------------------------------------ helpers
  const $ = id => document.getElementById(id);
  const key = (x, y) => x + ',' + y;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function rngOf(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lvMul = (lv, t) => 1 + 0.2 * ((lv && lv[t]) || 0);

  // worn brass slotted screw heads, rendered once and reused for panel corners and rack slots
  function makeBolt(seed) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), r = rngOf(seed);
    g.translate(32, 32);
    g.fillStyle = 'rgba(0,0,0,.5)'; g.beginPath(); g.arc(2, 3, 27, 0, 7); g.fill();
    const gr = g.createRadialGradient(-9, -10, 3, 0, 0, 28);
    gr.addColorStop(0, '#f3e0a6'); gr.addColorStop(0.35, '#c79a52'); gr.addColorStop(0.75, '#8a6430'); gr.addColorStop(1, '#4a3216');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 27, 0, 7); g.fill();
    g.strokeStyle = 'rgba(40,26,10,.6)'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 26, 0, 7); g.stroke();
    g.strokeStyle = 'rgba(255,240,200,.28)'; g.lineWidth = 1.5; g.beginPath(); g.arc(0, 0, 22, 3.4, 5); g.stroke();
    for (let i = 0; i < 150; i++) { const a = r() * 6.283, d = Math.sqrt(r()) * 25; g.fillStyle = r() > 0.5 ? 'rgba(255,230,170,.13)' : 'rgba(30,18,6,.16)'; g.fillRect(Math.cos(a) * d, Math.sin(a) * d, 1.6, 1.6); }
    for (let i = 0; i < 3; i++) { g.strokeStyle = 'rgba(40,26,10,.35)'; g.lineWidth = 1; const a = r() * 6.283; g.beginPath(); g.moveTo(Math.cos(a) * 10, Math.sin(a) * 10); g.lineTo(Math.cos(a + 0.5) * 24, Math.sin(a + 0.5) * 24); g.stroke(); }
    g.save(); g.rotate(r() * 3.14);
    g.fillStyle = '#2a1c0c'; g.beginPath(); g.moveTo(-23, -4.5);
    for (let x = -23; x <= 23; x += 4) g.lineTo(x, -4.5 + (r() - 0.5) * 2.2);
    g.lineTo(23, 4.5); for (let x = 23; x >= -23; x -= 4) g.lineTo(x, 4.5 + (r() - 0.5) * 2.2);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(235,200,130,.55)'; g.fillRect(-21, 4.9, 42, 1.4);
    g.fillStyle = 'rgba(130,95,45,.6)'; for (let i = 0; i < 16; i++) g.fillRect(-20 + r() * 40, -2.5 + r() * 5, 3, 1.2);
    g.restore();
    return c;
  }
  function makeSteam(rgb) {
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(' + rgb + ',.9)'); gr.addColorStop(0.4, 'rgba(' + rgb + ',.45)'); gr.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
  }
  const steamW = makeSteam('240,244,246'), steamD = makeSteam('70,64,58');
  function puff(g, x, y, r, a, dark) { if (a <= 0) return; g.globalAlpha = Math.min(1, a); g.drawImage(dark ? steamD : steamW, x - r, y - r, r * 2, r * 2); g.globalAlpha = 1; }
  const boltSprites = [11, 23, 37, 41].map(makeBolt);
  try { boltSprites.forEach((c, i) => document.documentElement.style.setProperty('--b' + (i + 1), 'url(' + c.toDataURL('image/png') + ')')); } catch (e) {}

  // ------------------------------------------------------------ game state
  function freshState() {
    const unlocked = [];
    for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) unlocked.push(key(x, y));
    return {
      coins: 100, league: 1, streak: 0,
      unlocked, parts: { '0,0': 'core' },
      lv: {}, auto: false, last: Date.now(), seed: 1, fights: 0, base: 1 + Math.floor(Math.random() * 9000)
    };
  }
  let S = freshState();
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) { const o = JSON.parse(raw); if (o && o.parts && o.unlocked) { S = Object.assign(freshState(), o); } }
    } catch (e) {}
  }
  function save() {
    S.last = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  }

  // ------------------------------------------------------------ bots and combat
  // cells: [{x, y, type}] -> parts with computed stats (neighbour bonuses)
  function compute(cells, lv) {
    const map = new Map();
    cells.forEach((c, i) => map.set(key(c.x, c.y), i));
    return cells.map((c, i) => {
      const T = TYPES[c.type];
      const nb = DIRS.map(d => map.get(key(c.x + d[0], c.y + d[1]))).filter(j => j !== undefined);
      const cnt = t => nb.filter(j => cells[j].type === t).length;
      const gearBonus = 1 + 0.25 * lvMul(lv, 'gear') * Math.min(2, cnt('gear'));
      const own = c.type === 'core' ? lvMul(lv, 'core') : lvMul(lv, c.type);
      const maxhp = T.hp * own * gearBonus;
      let dmg = 0, per = 0;
      if (isGun(c.type)) {
        per = T.per * (1 - Math.min(0.5, 0.2 * lvMul(lv, 'spring') * cnt('spring')));
        dmg = T.dmg * lvMul(lv, c.type) * (1 + 0.05 * ((lv && lv.core) || 0)) * (1 + 0.3 * lvMul(lv, 'boiler') * Math.min(3, cnt('boiler')));
      }
      const r = Math.min(0.6, 0.3 * lvMul(lv, 'shield'));
      const taken = Math.pow(1 - r, Math.min(2, cnt('shield')));
      const heal = c.type === 'repair' ? T.heal * lvMul(lv, 'repair') : 0;
      const dodge = 1 - Math.pow(1 - Math.min(0.45, 0.12 * lvMul(lv, 'wheel')), Math.min(2, cnt('wheel')));
      return { i, x: c.x, y: c.y, type: c.type, maxhp, dmg, per, taken, nb, heal, dodge };
    });
  }

  function simulate(A, B, rng, wantEvents) {
    const side = [A, B].map(arr => arr.map(p => ({ p, hp: p.maxhp, alive: true, cd: isGun(p.type) ? p.per * (0.4 + 0.6 * rng()) : p.type === 'repair' ? 0.5 + 0.5 * rng() : 0 })));
    const events = [];
    const coreIdx = side.map(s => s.findIndex(q => q.p.type === 'core'));
    let t = 0;
    const DT = 0.1, LIMIT = 90;
    function pick(s) {
      const arr = side[1 - s];
      let total = 0;
      const w = arr.map(q => {
        if (!q.alive) return 0;
        const empty = 4 - q.p.nb.filter(j => arr[j].alive).length;
        const v = 0.4 + empty;
        total += v;
        return v;
      });
      let r = rng() * total;
      for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0 && w[i] > 0) return i; }
      return w.findIndex(v => v > 0);
    }
    function pickAny(s) {
      const al = []; side[1 - s].forEach((q, i) => { if (q.alive) al.push(i); });
      return al.length ? al[Math.floor(rng() * al.length)] : -1;
    }
    function damage(s, idx, amount, from, kind, crit) {
      const q = side[s][idx];
      if (!q.alive) return;
      if (kind !== 'boom' && q.p.dodge > 0 && rng() < q.p.dodge) { if (wantEvents) events.push({ t, s: 1 - s, from, to: idx, dmg: 0, crit: false, kind: 'miss', hp: q.hp, died: false }); return; }
      const d = amount * q.p.taken;
      q.hp -= d;
      const died = q.hp <= 0;
      if (wantEvents) events.push({ t, s: 1 - s, from, to: idx, dmg: d, crit: !!crit, kind: kind || 'shot', hp: Math.max(0, q.hp), died });
      if (died) { q.alive = false; if (q.p.type === 'boiler') boom(s, idx); }
    }
    function boom(s, idx) {
      side[s][idx].p.nb.forEach(j => { if (side[s][j].alive) damage(s, j, 8, idx, 'boom'); });
    }
    while (t < LIMIT) {
      t += DT;
      const shots = [];
      for (let s = 0; s < 2; s++) {
        side[s].forEach((q, i) => {
          if (!q.alive) return;
          if (q.p.type === 'repair') {
            q.cd -= DT;
            if (q.cd <= 0) {
              q.cd += 1;
              q.p.nb.forEach(j => { const n = side[s][j]; if (n.alive && n.hp < n.p.maxhp) { n.hp = Math.min(n.p.maxhp, n.hp + q.p.heal); if (wantEvents) events.push({ t, s: 1 - s, from: i, to: j, dmg: -q.p.heal, crit: false, kind: 'heal', hp: n.hp, died: false }); } });
            }
            return;
          }
          if (!isGun(q.p.type)) return;
          q.cd -= DT;
          if (q.cd <= 0) {
            q.cd += q.p.per;
            const target = q.p.type === 'tesla' ? pickAny(s) : pick(s);
            if (target >= 0) {
              const crit = rng() < 0.1;
              shots.push({ s, from: i, target, kind: q.p.type === 'tesla' ? 'zap' : 'shot', mortar: q.p.type === 'mortar', amount: q.p.dmg * (0.9 + 0.2 * rng()) * (crit ? 1.5 : 1), crit });
            }
          }
        });
      }
      // both sides' shots land in the same tick
      shots.forEach(sh => {
        damage(1 - sh.s, sh.target, sh.amount, sh.from, sh.kind, sh.crit);
        if (sh.mortar) side[1 - sh.s][sh.target].p.nb.forEach(j => { if (side[1 - sh.s][j].alive) damage(1 - sh.s, j, sh.amount * 0.5, sh.from, 'boom'); });
      });
      const deadA = !side[0][coreIdx[0]].alive, deadB = !side[1][coreIdx[1]].alive;
      if (deadA || deadB) return { winner: deadB && !deadA ? 0 : 1, t, events };
      if (!side[0].some(q => q.alive && isGun(q.p.type)) && !side[1].some(q => q.alive && isGun(q.p.type))) break;
    }
    const fa = side[0][coreIdx[0]].hp / side[0][coreIdx[0]].p.maxhp, fb = side[1][coreIdx[1]].hp / side[1][coreIdx[1]].p.maxhp;
    return { winner: fa > fb ? 0 : 1, t, events };
  }

  function winChance(cellsA, lvA, cellsB, lvB, n) {
    const A = compute(cellsA, lvA), B = compute(cellsB, lvB);
    let w = 0;
    for (let i = 0; i < n; i++) if (simulate(A, B, rngOf(1000 + i * 7919), false).winner === 0) w++;
    return w / n;
  }

  // only parts linked to the core through orthogonal neighbours work
  function connectedSet() {
    const seen = new Set(['0,0']), q = ['0,0'];
    while (q.length) { const [x, y] = q.pop().split(',').map(Number); DIRS.forEach(d => { const k = key(x + d[0], y + d[1]); if (S.parts[k] && !seen.has(k)) { seen.add(k); q.push(k); } }); }
    return seen;
  }
  function playerCells() {
    const ok = connectedSet();
    return Object.keys(S.parts).filter(k => ok.has(k)).map(k => { const [x, y] = k.split(',').map(Number); return { x, y, type: S.parts[k] }; });
  }

  function genEnemy(league, seed) {
    const rng = rngOf(seed * 7919 + league * 104729);
    const allowed = BUILDABLE.filter(t => UNLOCK_LEAGUE[t] <= league);
    const n = 3 + Math.floor(league * 2.7);
    const cells = [{ x: 0, y: 0, type: 'core' }];
    const used = new Set(['0,0']);
    const frontier = () => {
      const out = [];
      cells.forEach(c => DIRS.forEach(d => { const k = key(c.x + d[0], c.y + d[1]); if (!used.has(k)) out.push([c.x + d[0], c.y + d[1]]); }));
      return out;
    };
    const cannons = Math.max(1, Math.ceil(n * 0.35));
    for (let i = 0; i < n; i++) {
      let type;
      if (i < cannons) type = 'cannon';
      else {
        const pool = allowed.filter(t => t !== 'cannon');
        type = pool[Math.floor(rng() * pool.length)];
        if (rng() < 0.3) type = 'plate';
      }
      const f = frontier();
      let cell;
      if (type === 'plate' || type === 'shield') {
        f.sort((a, b) => Math.abs(a[0]) + Math.abs(a[1]) - Math.abs(b[0]) - Math.abs(b[1]));
        cell = f[Math.floor(rng() * Math.min(3, f.length))];
      } else cell = f[Math.floor(rng() * f.length)];
      cells.push({ x: cell[0], y: cell[1], type });
      used.add(key(cell[0], cell[1]));
    }
    const l = Math.floor((league - 1) * 0.6);
    const lv = {};
    UPGRADABLE.forEach(t => (lv[t] = l));
    return { cells, lv, name: NAMES[Math.floor(rng() * NAMES.length)] + ' ' + ['I', 'II', 'III', 'IV', 'V'][Math.floor(rng() * 5)] };
  }

  // ------------------------------------------------------------ drawing of the parts (steampunk, drawn by code)
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function rivet(g, x, y, r) {
    g.fillStyle = '#e8c27a'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.fillStyle = '#7c5724'; g.beginPath(); g.arc(x + r * 0.3, y + r * 0.3, r * 0.5, 0, 7); g.fill();
  }

  function drawEnemyView() {
    const cv = $('enemyView'), g = cv.getContext('2d');
    const er = cv.getBoundingClientRect();
    if (er.width > 20 && (cv.width !== Math.round(er.width) || cv.height !== Math.round(er.height))) { cv.width = Math.round(er.width); cv.height = Math.round(er.height); }
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, cv.width, cv.height);
    if (!enemy) return;
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    enemy.cells.forEach(c => { x0 = Math.min(x0, c.x); x1 = Math.max(x1, c.x); y0 = Math.min(y0, c.y); y1 = Math.max(y1, c.y); });
    const u = Math.min((cv.width - 30) / (x1 - x0 + 1), (cv.height - 20) / (y1 - y0 + 1), 70);
    curLvl = enemy.lv;
    const ep = enemy.cells.map(c => ({ c, x: cv.width / 2 - ((c.x - (x0 + x1) / 2)) * u, y: cv.height / 2 + (c.y - (y0 + y1) / 2) * u, cx: -c.x, cy: c.y }));
    drawBody(g, ep, u, 'e', 0, 0, 5000 + S.seed);
    ep.forEach(q => drawPart(g, q.c.type, q.x, q.y, u * 0.95, T, -1));

  // ------------------------------------------------------------ loop
  let last = performance.now(), enemyTick = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    T += dt;
    try {
      const rc = board.getBoundingClientRect(), dp = Math.min(2, window.devicePixelRatio || 1);
      if (Math.abs(Math.round(rc.width * dp) - board.width) > 1 || Math.abs(Math.round(rc.height * dp) - board.height) > 1) { fit(); if (!userMoved) fitView(); }
      const w = W(), h = H();
      if (mode === 'arena' && battle) drawArena(bctx, w, h, dt); else drawBuild(bctx, w, h);
      if ((enemyTick -= dt) <= 0) { drawEnemyView(); enemyTick = 0.06; }
      if (toastT > 0 && (toastT -= dt) <= 0) $('toast').classList.remove('on');
      
    } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  }

  // offline progress: while the page was closed, the robot kept fighting (simplified)
  function offline() {
    if (!S.last) return;
    const secs = Math.min((Date.now() - S.last) / 1000, 4 * 3600);
    if (secs < 60) return;
    const fights = Math.floor(secs / 40), L = S.league;
    const p = chance === null ? 0 : chance;
    const gain = Math.round(fights * (p * (20 + 8 * L) + (1 - p) * (6 + 2 * L)) * 0.5);
    if (gain > 0) { S.coins += gain; setTimeout(() => toast('Your robot kept fighting while you were away: +' + gain + ' coins'), 400); }
  }

  load();
  { const m = /^#league(\d+)$/.exec(location.hash); if (m) { S.league = Math.max(1, Math.min(30, +m[1])); S.streak = 0; S.coins = Math.max(S.coins, 3000); S.newParts = BUILDABLE.filter(t => UNLOCK_LEAGUE[t] > 1 && UNLOCK_LEAGUE[t] <= S.league); save(); } }
  fit();
  buildPalette();
  fitView();
  enemy = genEnemy(S.league, S.seed);
  recompute();
  offline();
  refreshUI();
  save();
  window.__automa = { unlockDemo: t => { pendingUnlock = [t]; showUnlock(); }, S: () => S, compute, simulate, genEnemy, winChance, playerCells, startBattle, view, state: () => ({ mode, tool, chance }), setTool: t => { tool = t; }, clickCell };
  requestAnimationFrame(frame);
})();
